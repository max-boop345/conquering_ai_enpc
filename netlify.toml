[build]
  # le site est généré à chaque déploiement : assets web (dont le port JS
  # moteur+solveur pour live/duel en navigateur) + API JSON pré-générée
  # (replay, analyses par coup, benchmarks).
  command = "python3 scripts/export_site.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"
